poll_cadence_minutes: 5        # how often PlaywrightSource collects tweets
eval_cadence_minutes: 2        # how often aggregator + strategy runs

score_window_minutes: 60       # rolling window for per-ticker score
credibility:
  tier_weights:
    1: 1.0
    2: 0.7
    3: 0.4

trust_graph:
  min_credible_voices: 3       # minimum distinct credible authors in window
  score_threshold: 5.0         # |score| must exceed this to emit signal
  cooldown_hours: 4            # don't re-alert same ticker within this window
  cooldown_override_multiplier: 2.0  # bypass cooldown if score doubles

retention:
  prune_interval_minutes: 60        # how often to run the DB pruner
  tweets_keep_days: 30              # delete tweets + extractions older than this
  scores_keep_hours: 24             # ticker_scores / theme_scores older than this
  edges_keep_hours: 24              # graph_edges older than this

synth:
  max_driving_tweets: 10       # top N tweets passed to synthesizer

tradingview:
  enabled: true
  poll_cadence_minutes: 5
  top_n_per_side: 100
  min_market_cap_m: 100         # USD millions; skip penny stocks
  min_volume: 100000
  confirmation_weight: 0.5      # ±50% max boost/cut from price action
  strong_move_pct: 5.0          # at ±5% the multiplier saturates
  discovery_weight: 0.5         # score for movers with no Twitter data = pct_change × this
  investigate:
    enabled: true
    pct_threshold: 5.0          # |%| above which an unexplained mover triggers an X search
    max_per_cycle: 5
    dedupe_minutes: 30

universe:
  refresh_days: 7              # re-download symbol list every N days

paper_trading:
  enabled: true
  approval_timeout_minutes: 15
  price_cache_seconds: 60

# ── Research-grade pipeline switch ───────────────────────────────────────────
# observe — full feature pipeline runs, signals + forward returns are recorded,
#           NO orders are placed, NO per-signal Telegram blast (only digests).
# paper   — auto-execute paper trades on confidence-qualifying signals,
#           rich Telegram journal per trade. Default once IBKR paper is active.
# live    — same as paper but with broker.trading_mode=live and tiny size.
pipeline:
  mode: paper
  auto_execute_confidence_min: 70.0
  approval_confidence_min: 50.0

# Confidence-scoring weights (initial guesses — recalibrate from observe data)
features:
  confidence_weights:
    gradient: 25.0
    acceleration: 15.0
    roc_3m: 10.0
    rel_strength_spy: 10.0
    rel_strength_sector: 10.0
    vwap_above: 10.0
    broke_pmh: 10.0
    rel_volume: 5.0
    extension_penalty: -5.0
    spread_penalty: -5.0

# Forward-return observer (records realised returns after each signal)
observer:
  horizons_seconds: [30, 60, 180, 300, 900, 1800]   # 30s, 1m, 3m, 5m, 15m, 30m
  tick_seconds: 5.0

# MFE/MAE tracker (polls live price per open position)
position_tracker:
  poll_seconds: 5.0

# Top-level Twitter kill switch (dormant by default in momentum mode).
# Code remains in the repo for optional re-enable.
twitter:
  enabled: false

momentum:
  enabled: false                                # master switch — flip true when IBKR is connected
  poll_cadence_seconds: 30                      # IBKR scanner + feature refresh
  eval_cadence_seconds: 15                      # how often MomentumStrategy runs
  # Entry rules (pre-scoring filters)
  entry_threshold_pct_per_min: 0.3              # |gradient| floor before features get scored
  min_total_move_pct: 1.5                       # filter out flat noise
  approval_timeout_seconds: 60                  # short timeout — momentum fades fast
  max_trades_per_day: 10                        # hard cap on auto-executes
  # End-of-day
  flatten_minutes_before_close: 5               # close all positions N min before 4pm ET

broker:
  enabled: false              # flip to true when IBKR account is active
  trading_mode: paper         # paper | live  (paper=7497/4002, live=7496/4001)
  host: 127.0.0.1
  port: 7497                  # TWS paper=7497, live=7496 | IB Gateway paper=4002, live=4001
  client_id: 1
  connect_timeout_s: 10.0
  risk:
    max_position_pct: 2.0     # max % of portfolio per trade
    stop_loss_pct: 2.0        # stop placed this % away from fill price
    max_open_positions: 5     # hard cap on concurrent open positions

  market_data:
    enabled: false            # use IBKR as market data source instead of TradingView
    top_n_per_side: 50        # scanner rows per side (gainers / losers)
    gradient_top_n: 20        # compute features for top N movers by |%change|
    gradient_bars: 10         # last N 1-min bars used for slope computation
    feature_bars: 12          # 1-min OHLCV window used by the feature engine
    snapshot_enabled: true    # request bid/ask snapshot per ticker each cycle
    poll_cadence_minutes: 5

eod_summary:
  enabled: true
  cron_hour_utc: 21            # 16:00 ET = 21:00 UTC
  cron_minute: 0
  days: mon-fri

playwright:
  headless: true               # run silently in background
  profile_dir: browser_profile_chrome
  request_delay_min_s: 1.0
  request_delay_max_s: 2.0
  max_accounts_per_poll: 10
  scroll_count: 1              # number of scrolls per timeline page
