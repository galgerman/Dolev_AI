# Theme taxonomy for LLM extraction.
# The LLM MUST pick only from these theme keys. Off-taxonomy themes are rejected.
#
# Each theme:
#   description: shown in the prompt to anchor meaning
#   tickers: { TICKER: weight } where weight ∈ [-1.0, 1.0]
#       positive weight = bullish theme boosts this ticker
#       negative weight = bullish theme HURTS this ticker (inverse exposure)
#   tickers: {} = event flag; no graph node, only attaches to tickers
#                 mentioned in the same post (e.g. earnings_beat)
#
# Cascade: theme_score × ticker_weight × 0.5 = boost added to that ticker
#
# CASCADE_FACTOR is global (in code, 0.5).

