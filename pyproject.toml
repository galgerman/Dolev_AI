[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dolev-ai"
version = "0.1.0"
description = "Twitter-driven stock trend agent — Phase 1 (research & alerting)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30.0",
    "playwright>=1.44.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "sqlalchemy>=2.0.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dolev_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: marks tests as slow (deselect with '-m not slow')"]
